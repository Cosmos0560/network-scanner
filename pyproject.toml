[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-scanner"
dynamic = ["version"]
description = "Defensive TCP connect scanner and attack-surface drift monitor for networks you are authorized to test."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Otabek Yakubov" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Information Technology",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<0.16",
    "mypy>=1.18,<3",
    "types-PyYAML>=6,<7",
]

[project.scripts]
network-scanner = "network_scanner.cli.main:main"

[tool.hatch.version]
path = "src/network_scanner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/network_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/network_scanner", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104"]

[tool.mypy]
files = ["src", "scripts", "tests"]
strict = true
warn_unreachable = true
mypy_path = "scripts"
